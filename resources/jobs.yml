# The orchestrated cycle and the non-admin access test
resources:
  jobs:
    nextdaq_rebalance_cycle:
      name: nextdaq_rebalance_cycle
      description: "One cycle: ingest (Lakeflow) -> forecast (ML) -> scenario briefs (GenAI) -> evaluate -> govern -> serve (Lakebase)"
      max_concurrent_runs: 1
      queue: {enabled: true}
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: ${var.landing_root}/price_manifests/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies: ["mlflow[databricks]>=3.1", "scikit-learn>=1.4"]
        - environment_key: ops
          spec:
            environment_version: "4"
            dependencies: ["psycopg[binary]>=3.2", "databricks-sdk>=0.70"]
      tasks:
        - task_key: refresh_pipeline
          pipeline_task: {pipeline_id: "${resources.pipelines.nextdaq_pipeline.id}"}

        - task_key: train_and_score
          depends_on: [{task_key: refresh_pipeline}]
          environment_key: ml
          max_retries: 1
          spark_python_task:
            python_file: ${var.code_root}/ai/train_score.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        - task_key: ai_briefs
          depends_on: [{task_key: refresh_pipeline}]
          environment_key: ml
          max_retries: 1
          spark_python_task:
            python_file: ${var.code_root}/ai/briefs.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--endpoint", "${var.llm_endpoint}",
                         "--code-root", "${var.code_root}"]

        - task_key: evaluate_ai
          depends_on: [{task_key: ai_briefs}]
          environment_key: ml
          max_retries: 1
          spark_python_task:
            python_file: ${var.code_root}/ai/evaluate.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--judge-endpoint", "${var.judge_endpoint}"]

        - task_key: governance
          depends_on: [{task_key: train_and_score}, {task_key: evaluate_ai}]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file: {path: ../src/governance/governance.sql}

        - task_key: sync_lakebase
          depends_on: [{task_key: governance}]
          environment_key: ops
          max_retries: 1
          spark_python_task:
            python_file: ${var.code_root}/serve/sync_lakebase.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}",
                         "--endpoint", "projects/${var.lakebase_project}/branches/production/endpoints/primary",
                         "--app-sp", "${var.app_sp}"]
    nextdaq_access_test:
      name: nextdaq_access_test
      description: Non-admin access check, runs AS the Client Services service principal (tools/access_test.sh grants, runs, revokes)
      run_as:
        service_principal_name: ${var.tester_sp}
      environments:
        - environment_key: default
          spec: {environment_version: "4"}
      tasks:
        - task_key: access_test
          environment_key: default
          spark_python_task:
            python_file: ${var.code_root}/governance/access_test.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
