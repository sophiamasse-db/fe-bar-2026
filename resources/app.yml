resources:
  apps:
    nextdaq_app:
      name: nextdaq-rebalance-simulator
      description: NextDAQ-100 rebalance simulator - scenarios, forecast, approvals, Genie
      source_code_path: ../src/app
      user_api_scopes: ["sql", "dashboards.genie"]
      resources:
        - name: sql-warehouse
          sql_warehouse: {id: "${var.warehouse_id}", permission: CAN_USE}
        - name: genie-space
          genie_space: {name: "NextDAQ-100 Index Methodology Genie", space_id: "${var.genie_space_id}", permission: CAN_RUN}
        - name: llm-endpoint
          serving_endpoint: {name: "${var.llm_endpoint}", permission: CAN_QUERY}
        - name: lakebase
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
