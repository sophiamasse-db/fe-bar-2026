# Storage, pipeline and data setup
resources:
  schemas:
    nextdaq_index:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: NextDAQ-100 rebalance simulator - synthetic and public data only
  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.nextdaq_index.name}
      name: landing
      volume_type: MANAGED
      comment: Raw files exactly as the source systems export them

    code:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.nextdaq_index.name}
      name: code
      volume_type: MANAGED
      comment: Job source code, synced from the repo by tools/deploy.sh (workaround for unreliable workspace-file reads on serverless)
  pipelines:
    nextdaq_pipeline:
      name: nextdaq_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      photon: true
      configuration:
        landing_path: ${var.landing_root}
      libraries:
        - file: {path: ../src/pipeline/01_bronze.sql}
        - file: {path: ../src/pipeline/02_silver.sql}
        - file: {path: ../src/pipeline/03_reconciliation.sql}
        - file: {path: ../src/pipeline/04_gold.sql}
  jobs:
    nextdaq_setup_data:
      name: nextdaq_setup_data
      description: Land public source files and generate the synthetic market data and index history
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: land_public
          environment_key: default
          max_retries: 3
          min_retry_interval_millis: 15000
          spark_python_task:
            python_file: ${var.code_root}/data/land_public.py
            parameters: ["--root", "${var.landing_root}"]
        - task_key: generate_synthetic
          depends_on: [{task_key: land_public}]
          environment_key: default
          max_retries: 3
          min_retry_interval_millis: 15000
          spark_python_task:
            python_file: ${var.code_root}/data/generate.py
            parameters: ["--root", "${var.landing_root}", "--code-root", "${var.code_root}"]
