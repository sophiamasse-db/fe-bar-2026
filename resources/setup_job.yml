resources:
  jobs:
    nextdaq_setup_data:
      name: nextdaq_setup_data
      description: Land public source files and generate the synthetic market data and index history
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: land_public
          environment_key: default
          max_retries: 3
          min_retry_interval_millis: 15000
          spark_python_task:
            python_file: ${var.code_root}/data/land_public.py
            parameters: ["--root", "${var.landing_root}"]
        - task_key: generate_synthetic
          depends_on: [{task_key: land_public}]
          environment_key: default
          max_retries: 3
          min_retry_interval_millis: 15000
          spark_python_task:
            python_file: ${var.code_root}/data/generate.py
            parameters: ["--root", "${var.landing_root}", "--code-root", "${var.code_root}"]
